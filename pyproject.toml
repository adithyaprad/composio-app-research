[project]
name = "composio-app-research"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".agents", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Phase-1 script predates the lint config; left as is.
"scripts/*" = ["E501", "UP017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
